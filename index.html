<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #7b0f12;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Gambar center */
    .image-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .image-wrapper img {
      max-width: 60vw;
      max-height: 70vh;
      display: block;
      filter: saturate(1.05);
      box-shadow:
        0 0 60px rgba(123,15,18,0.8),
        0 0 120px rgba(123,15,18,0.6);
    }

    /* Vignette */
    .image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(0,0,0,0) 55%,
        rgba(123,15,18,0.65) 100%
      );
      pointer-events: none;
    }

    /* Arrow tepat di bawah gambar */
    .arrow {
      position: absolute;
      left: 50%;
      bottom: -25px; /* jarak arrow dari bawah gambar */
      transform: translateX(-50%);
      font-size: 32px;
      color: white;
      text-decoration: none;
      animation: bounce 1.5s infinite;
      user-select: none;
    }

    .arrow:hover {
      opacity: 0.8;
    }

    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-wrapper">
      <img src="img/img (1).png" alt="valentine">
      <a href="https://val-5.vercel.app/" class="arrow">→</a>
    </div>
  </div>
</body>
</html>
