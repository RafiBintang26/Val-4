<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Scrapbook Message</title>
    <style>
        body {
            margin: 0;
            background-color: #6d0707; /* Warna merah gelap sesuai gambar */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* Container Pesan Utama */
        .scrapbook-container {
            position: relative;
            max-width: 600px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        /* Styling Potongan Kertas */
        .note {
            background: #fffef0;
            color: #1a1a1a;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            transform: rotate(var(--r)); /* Rotasi acak */
            display: inline-block;
            border: 1px solid #ddd;
        }

        /* Animasi Floating Stiker di Background */
        .stickers-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .sticker {
            position: absolute;
            font-size: 2rem;
            opacity: 0.5;
            animation: drift 6s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(100vh) rotate(0deg); }
            to { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Link Arrow */
        .arrow-link {
            margin-top: 50px;
            text-decoration: none;
            color: white;
            font-size: 3rem;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }
    </style>
</head>
<body>

    <div class="stickers-bg" id="stickers"></div>

    <div class="scrapbook-container">
        <!-- Kalimat Pertama -->
        <div class="note" style="--r: -2deg">truly</div>
        <div class="note" style="--r: 3deg">madly</div>
        <div class="note" style="--r: -1deg">deeply</div>
        <div class="note" style="--r: 2deg">you</div>
        <div class="note" style="--r: -3deg">complete</div>
        <div class="note" style="--r: 1deg">me</div>
        
        <div style="width: 100%; height: 20px;"></div> <!-- Spasi -->

        <!-- Kalimat Baru Sesuai Permintaan -->
        <div class="note" style="--r: 2deg">I</div>
        <div class="note" style="--r: -2deg; color: red;">❤️</div>
        <div class="note" style="--r: 1deg">love</div>
        <div class="note" style="--r: -1deg">you</div>
        <div class="note" style="--r: 3deg">even</div>
        <div class="note" style="--r: -2deg">when</div>
        <div class="note" style="--r: 1deg">you</div>
        <div class="note" style="--r: -3deg">are</div>
        <div class="note" style="--r: 2deg">not</div>
        <div class="note" style="--r: -1deg">at</div>
        <div class="note" style="--r: 3deg">your</div>
        <div class="note" style="--r: -2deg">best,</div>
        <div class="note" style="--r: 1deg">sad</div>
        <div class="note" style="--r: -3deg">and</div>
        <div class="note" style="--r: 2deg">feel</div>
        <div class="note" style="--r: -1deg">like</div>
        <div class="note" style="--r: 4deg">no</div>
        <div class="note" style="--r: -2deg">one</div>
        <div class="note" style="--r: 1deg">cares</div>
        <div class="note" style="--r: -3deg">or</div>
        <div class="note" style="--r: 2deg">loves</div>
        <div class="note" style="--r: -1deg">you</div>
    </div>

    <a href="https://val-6.vercel.app" class="arrow-link">→</a>

    <script>
        const emojis = ['🧸', '🎀', '🍭', '💖', '💌', '🍓', '✨', '🐾'];
        const bg = document.getElementById('stickers');

        for (let i = 0; i < 20; i++) {
            const s = document.createElement('div');
            s.className = 'sticker';
            s.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = (Math.random() * 3 + 4) + 's';
            s.style.animationDelay = (Math.random() * 5) + 's';
            bg.appendChild(s);
        }
    </script>
</body>
</html>
