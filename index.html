<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #7b0f12;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* CENTER BENAR-BENAR */
    .image-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .image-wrapper img {
      max-width: 60vw;
      max-height: 70vh;
      display: block;
      filter: saturate(1.05);
      box-shadow:
        0 0 60px rgba(123,15,18,0.8),
        0 0 120px rgba(123,15,18,0.6);
    }

    /* Vignette tetap center */
    .image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(0,0,0,0) 55%,
        rgba(123,15,18,0.65) 100%
      );
      pointer-events: none;
    }

    /* Panah */
    .arrow {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 28px;
      color: white;
      cursor: pointer;
      animation: bounce 1.5s infinite;
      user-select: none;
    }

    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="image-wrapper">
      <img src="img/img (1).png" alt="valentine">
    </div>

    <div class="arrow" onclick="nextPage()">→</div>
  </div>

  <script>
    function nextPage() {
      alert("Next 💕");
      // window.location.href = "page2.html";
    }
  </script>

</body>
</html>
